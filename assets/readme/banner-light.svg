<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="FollowCam: a pixel camcorder on a tripod that tilts to follow a bouncing basketball">
<style>
  :root { --teal: #0f766e; --ink: #0d1117; --grey: #57606a; --white: #ffffff; --orange: #d4570f; --red: #cf222e; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .h { font-weight: 700; letter-spacing: -0.03em; }
  .px { shape-rendering: crispEdges; }
  .ants { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 9 7; animation: march 1.2s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -32; } }
  .rise { opacity: 0; animation: rise 12s ease infinite; }
  @keyframes rise { 0%, 8% { opacity: 0; transform: translateY(10px); } 16% { opacity: 1; transform: none; } 92% { opacity: 1; } 100% { opacity: 0; } }
  .d1 { animation-delay: .25s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .75s; }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-teal { fill: var(--teal); } .c-ink { fill: var(--ink); } .c-grey { fill: var(--grey); } .c-white { fill: var(--white); } .c-orange { fill: var(--orange); } .c-red { fill: var(--red); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 12s cubic-bezier(.2,.9,.3,1.4) infinite; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-head { transform-box: fill-box; transform-origin: 50% 100%; animation: m-head 2.6s ease-in-out infinite; }
  @keyframes m-head { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .g-ball { transform-box: fill-box; transform-origin: center; animation: m-ball .9s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes m-ball { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-head, .g-ball { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; transform: none; } .ants { animation: none; } }
</style>
